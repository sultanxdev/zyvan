# ─────────────────────────────────────────────────────────────
# Zyvan — Docker Compose (Local Development)
#
# Services:
#   - PostgreSQL (source of truth)
#   - Redis (sessions/cache)
#   - RabbitMQ (delivery queue)
#
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose down           # Stop all services
#   docker-compose logs -f        # Tail all logs
# ─────────────────────────────────────────────────────────────


services:
  # ─── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: zyvan-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: zyvan
      POSTGRES_PASSWORD: zyvan_secret
      POSTGRES_DB: zyvan_dev
    volumes:
      - zyvan-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zyvan -d zyvan_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: zyvan-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - zyvan-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── RabbitMQ ───────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: zyvan-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'    # AMQP
      - '15672:15672'  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: zyvan
      RABBITMQ_DEFAULT_PASS: zyvan_secret
    volumes:
      - zyvan-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  zyvan-postgres-data:
  zyvan-redis-data:
  zyvan-rabbitmq-data:
