# ─────────────────────────────────────────────────────────────
# Zyvan — Production Docker Compose Stack
# Multi-container orchestration for the complete platform.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
# ─────────────────────────────────────────────────────────────

services:
  # ─── 1. PostgreSQL (Source of Truth) ──────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: zyvan-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zyvan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zyvan_secret_prod}
      POSTGRES_DB: ${POSTGRES_DB:-zyvan_prod}
    ports:
      - '5432:5432'
    volumes:
      - zyvan-prod-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-zyvan} -d ${POSTGRES_DB:-zyvan_prod}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 2. Redis (Rate Limiting & Token Buckets) ───────────────
  redis:
    image: redis:7-alpine
    container_name: zyvan-prod-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - zyvan-prod-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 3. RabbitMQ (AMQP Event Queue + TTL / DLX Retries) ─────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: zyvan-prod-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-zyvan}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-zyvan_secret_prod}
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - zyvan-prod-mqdata:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── 4. Zyvan API (Express Ingestion & Management Engine) ───
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: zyvan-prod-api
    restart: always
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-zyvan}:${POSTGRES_PASSWORD:-zyvan_secret_prod}@postgres:5432/${POSTGRES_DB:-zyvan_prod}?schema=public
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-zyvan}:${RABBITMQ_PASS:-zyvan_secret_prod}@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      API_KEY_PEPPER: ${API_KEY_PEPPER:-a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      HMAC_KEY_VERSION: v1
      JWT_SECRET: ${JWT_SECRET:-zyvan-production-jwt-secret-change-in-prod}
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── 5. Zyvan Worker (Asynchronous Delivery & DLQ Worker) ────
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: zyvan-prod-worker
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-zyvan}:${POSTGRES_PASSWORD:-zyvan_secret_prod}@postgres:5432/${POSTGRES_DB:-zyvan_prod}?schema=public
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-zyvan}:${RABBITMQ_PASS:-zyvan_secret_prod}@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      HMAC_KEY_VERSION: v1
      WORKER_PREFETCH: 10
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ─── 6. Zyvan Web (Next.js Dashboard & Simulator) ───────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: zyvan-prod-web
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      BACKEND_API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: /api/proxy
    depends_on:
      - api

volumes:
  zyvan-prod-pgdata:
  zyvan-prod-redisdata:
  zyvan-prod-mqdata:
